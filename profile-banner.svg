<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc">
  <title id="title">Tam Nguyen Dinh | Kai Nguyen</title>
  <desc id="desc">Aspiring DevOps Engineer | Cloud and Automation</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
