      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
